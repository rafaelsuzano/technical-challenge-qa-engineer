name: E2E Playwright

on:
  push:
    paths:
      - 'Sinky/technical-challenge-qa-engineer/**'
  pull_request:
    paths:
      - 'Sinky/technical-challenge-qa-engineer/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: Sinky/technical-challenge-qa-engineer

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Sinky/technical-challenge-qa-engineer/e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: Sinky/technical-challenge-qa-engineer/e2e
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Start Docker Compose
        working-directory: Sinky/technical-challenge-qa-engineer/app
        run: |
          docker compose up -d --build
          for i in $(seq 1 40); do
            if curl -fsS "http://localhost:3001/tasks" >/dev/null 2>&1 && curl -fsS "http://localhost:3000" >/dev/null 2>&1; then
              echo "App is up"
              exit 0
            fi
            sleep 3
          done
          echo "Timeout waiting for services"
          docker compose logs
          exit 1

      - name: Run Playwright
        working-directory: Sinky/technical-challenge-qa-engineer/e2e
        env:
          CI: 'true'
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          API_BASE_URL: http://localhost:3001
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Sinky/technical-challenge-qa-engineer/e2e/playwright-report
          retention-days: 7

      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: Sinky/technical-challenge-qa-engineer/e2e/test-results
          retention-days: 7
